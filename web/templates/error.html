<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ code }} · SentinelBank</title>
  {% include "partials/theme_boot.html" %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/glass.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
</head>
<body>
<div class="login-wrap">
  <div class="glass card" style="width:min(560px,100%);text-align:center">
    <div class="brand" style="justify-content:center;margin-bottom:var(--s-3)">
      <span class="brand-mark">🛡️</span><span>Sentinel<span class="dim">Bank</span></span>
    </div>
    <div class="stat-value" style="font-size:3rem">{{ code }}</div>
    <p class="muted">{{ message }}</p>
    <a class="btn btn-primary" href="{{ url_for('auth.root') }}">Back to the dashboard</a>
  </div>
</div>
</body>
</html>
